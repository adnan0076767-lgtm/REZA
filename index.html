*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#071507;
  color:#0f380f;
  font-family:'Press Start 2P',monospace;
}

body{
  overflow-x:hidden;
}

button,
input,
select{

}

button{

}

#app{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  background:

}

.console{
  width:min(100%,1080px);
  min-height:720px;
  background:#9bbc0f;
  border:10px solid #0f380f;
  box-shadow:
    0 0 0 5px #306230,
    0 20px 60px rgba(0,0,0,.75);
  overflow:hidden;
  position:relative;
}

.console::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:100;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(15,56,15,.06) 0px,
      rgba(15,56,15,.06) 2px,
      transparent 2px,
      transparent 5px
    );
}

.topbar{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  background:#8bac0f;
  border-bottom:6px solid #0f380f;
}

.brand{
  font-size:16px;
  line-height:1.5;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:flex-end;
}

.stat{
  border:3px solid #0f380f;
  background:#9bbc0f;
  padding:7px 8px;
  font-size:8px;
}

.screen{
  position:relative;
  z-index:2;
  min-height:630px;
  padding:18px;
}

.panel{
  border:5px solid #0f380f;
  background:#8bac0f;
  padding:16px;
  box-shadow:8px 8px 0 #306230;
}

.title{
  font-size:17px;
  line-height:1.7;
  margin-bottom:15px;
}

.subtitle{
  font-size:9px;
  line-height:1.9;
}

.home-logo{
  text-align:center;
  border:6px solid #0f380f;
  padding:22px 10px;
  margin-bottom:18px;
  background:#9bbc0f;
  box-shadow:8px 8px 0 #306230;
}

.home-logo h1{
  margin:0 0 12px;
  font-size:30px;
  line-height:1.5;
}

.home-logo p{
  margin:7px 0;
  font-size:8px;
  line-height:1.8;
}

.pixel-btn{
  width:100%;
  border:4px solid #0f380f;
  background:#9bbc0f;
  color:#0f380f;
  padding:14px 12px;
  margin:7px 0;
  font-family:inherit;
  font-size:10px;
  text-align:left;
  cursor:pointer;
  box-shadow:5px 5px 0 #306230;
  position:relative;
  z-index:3;
}

.pixel-btn:hover{
  background:#c6d957;
}

.pixel-btn:active{
  transform:translate(4px,4px);
  box-shadow:1px 1px 0 #306230;
}

.pixel-btn.center{
  text-align:center;
}

.cursor{
  display:inline-block;
  width:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  border:4px solid #0f380f;
  background:#9bbc0f;
  padding:14px;
  min-height:125px;
  cursor:pointer;
  box-shadow:5px 5px 0 #306230;

.card:hover{
  background:#c6d957;

.card-title{
  font-size:10px;
  line-height:1.7;
}

.card-text{

  line-height:1.8;

}

.lesson{
  font-size:10px;
  line-height:1.9;

.lesson h3{
  font-size:13px;

.example{

  background:#9bbc0f;
  line-height:1.9;
}

.example strong{

  margin-bottom:8px;
}

.step{
  border-left:6px solid #0f380f;
  padding:8px 12px;
  margin:8px 0;
  background:#9bbc0f;
}

.question{
  border:5px solid #0f380f;
  background:#9bbc0f;
  padding:18px;
  font-size:12px;
  line-height:1.9;
  margin-bottom:15px;
}

  width:100%;
  border:4px solid #0f380f;
  background:#8bac0f;
  color:#0f380f;
  padding:13px;
  margin:7px 0;
  font-family:inherit;
  font-size:9px;
  text-align:left;
  cursor:pointer;
  box-shadow:3px 3px 0 #306230;
}

.option:hover{
  background:#c6d957;
}

.option:active{
  transform:translate(2px,2px);
}

.option.correct{
  background:#306230;
  color:#9bbc0f;
}

.option.wrong{
  background:#071507;
  color:#9bbc0f;
}

.feedback{
  border:4px solid #0f380f;
  padding:14px;
  margin-top:15px;
  font-size:9px;
  line-height:2;
  background:#9bbc0f;
}

.voice-box{
  border:6px solid #0f380f;
  background:#8bac0f;
  padding:18px;
  margin-top:18px;
  text-align:center;
}

.voice-status{
  font-size:9px;
  line-height:1.9;
}

.mic{
  width:95px;
  height:95px;
  margin:16px auto;
  border:6px solid #0f380f;
  border-radius:50%;
  background:#9bbc0f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  cursor:pointer;
  box-shadow:7px 7px 0 #306230;
}

.mic:active{
  transform:translate(4px,4px);
  box-shadow:2px 2px 0 #306230;
}

.mic.listening{
  background:#c6d957;
  animation:pulse .7s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
  }
}

.transcript{
  border:4px dashed #0f380f;
  padding:12px;
  min-height:55px;
  font-size:8px;
  line-height:1.8;
}

.progress{
  border:4px solid #0f380f;
  height:24px;
  padding:3px;
  margin:10px 0;
}

.progress-fill{
  height:100%;
  background:#0f380f;
}

.controller{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.ctrl{
  border:4px solid #0f380f;
  background:#9bbc0f;
  color:#0f380f;
  padding:11px 15px;
  font-family:inherit;
  font-size:9px;

  box-shadow:4px 4px 0 #306230;

.ctrl:active{

input,
select{

  background:#9bbc0f;
  color:#0f380f;
  padding:12px;
  font-size:9px;

label{

#toast{

  bottom:20px;
  transform:translateX(-50%);

  background:#0f380f;
  color:#9bbc0f;
  text-align:center;
  font-size:8px;

#boot{

  inset:0;
  z-index:999999;
  background:#0f380f;
  color:#9bbc0f;

.boot-inner{

.boot-logo{

.boot-sub{
  font-size:9px;
  line-height:2;

.boot-bar{
  height:30px;
  border:4px solid #9bbc0f;
  padding:3px;
  margin-top:22px;

.boot-fill{
  height:100%;
  width:0;
  background:#9bbc0f;
  animation:bootload 2.2s linear forwards;
}

@keyframes bootload{
  to{width:100%}
}

@keyframes blink{
  50%{opacity:.35}
}

@media(max-width:700px){

  #app{
    padding:0;
    align-items:stretch;
  }

  .console{
    width:100%;
    min-height:100vh;

  .title{

  .pixel-btn{

  }

  .question{
    font-size:9px;
  }
}
</style>
</head>

function saveGame(show=true){

  try{

    localStorage.setItem(
      "reza_pixel_learning_v92",
      JSON.stringify(state)
    );

    if(show){
      showToast("GAME SAVED ✓");
    }

  }catch(error){

    console.error("SAVE ERROR:",error);

  }
}

function loadGame(){

  try{

    const raw=localStorage.getItem(
      "reza_pixel_learning_v92"
    );

    if(!raw){
      updateStats();
      return;
    }

    const saved=JSON.parse(raw);

    state={
      ...DEFAULT_STATE,
      ...saved,
      settings:{
        ...DEFAULT_STATE.settings,
        ...(saved.settings || {})
      },
      progress:saved.progress || {}
    };

  }catch(error){

    console.error("LOAD ERROR:",error);

    state=JSON.parse(
      JSON.stringify(DEFAULT_STATE)
    );
  }

  updateStats();
}

  state.exp+=exp;

    state.level++;

/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

  try{

    if(!audioCtx){

      const AudioContext=
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      audioCtx=new AudioContext();
    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

  }catch(error){

    console.warn(
      "Audio unavailable:",
      error
    );

  }
}

function beep(
  frequency=440,
  duration=.08
){

  if(!musicOn){
    return;
  }

  try{

    initAudio();

    if(!audioCtx){
      return;
    }

    const oscillator=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    oscillator.type="square";
    oscillator.frequency.value=frequency;

    gain.gain.setValueAtTime(
      .035,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
      audioCtx.currentTime+duration
    );

  }catch(error){}
}

function loadVoices(){

    !("speechSynthesis" in window)
  ){
    return;
  }

  voices=
    window.speechSynthesis.getVoices();
}

loadVoices();

if("speechSynthesis" in window){

  window.speechSynthesis.onvoiceschanged=
    loadVoices;
}

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){

    showToast(
      "TEXT TO SPEECH TIDAK TERSEDIA"
    );

    return;
  }

  try{

    window.speechSynthesis.cancel();

    const utterance=
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang=
      state.settings.lang;

    utterance.rate=
      Number(state.settings.rate) || .9;

    utterance.pitch=1.05;
    utterance.volume=1;

    const baseLanguage=
      state.settings.lang
        .split("-")[0]
        .toLowerCase();

    const selectedVoice=
      voices.find(
        voice=>
          voice.lang===state.settings.lang
      ) ||
      voices.find(
        voice=>
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith(baseLanguage)
      );

    if(selectedVoice){
      utterance.voice=
        selectedVoice;
    }

    window.speechSynthesis.speak(
      utterance
    );

  }catch(error){

    console.error(
      "TTS ERROR:",
      error
    );

  }
}

/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function getRecognitionClass(){

  return window.SpeechRecognition ||
         window.webkitSpeechRecognition ||
         null;
}

function createRecognition(){

  const Recognition=
    getRecognitionClass();

  if(!Recognition){
    recognition=null;
    return null;
  }

  try{

    const instance=
      new Recognition();

    instance.lang=
      state.settings.lang;

    instance.continuous=false;
    instance.interimResults=false;
    instance.maxAlternatives=3;

    instance.onstart=()=>{
      setVoiceUI(true);
    };

    instance.onresult=(event)=>{

      let transcript="";

      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        transcript +=
          event.results[i][0]
            .transcript+" ";
      }

      transcript=
        transcript.trim();

      const output=
        document.getElementById(
          "transcript"
        );

      if(output){
        output.textContent=
          transcript ||
          "Tidak ada jawaban.";
      }

      processVoiceAnswer(
        transcript
      );
    };

    instance.onerror=(event)=>{

      console.warn(
        "Speech recognition error:",
        event.error
      );

      setVoiceUI(false);

      let message=
        "VOICE ERROR: "+
        event.error;

      if(event.error==="not-allowed"){
        message=
          "MIC DITOLAK. IZINKAN MICROPHONE.";
      }

      const status=
        document.getElementById(
          "voiceStatus"
        );

      if(status){
        status.textContent=
          message;
      }
    };

    instance.onend=()=>{
      setVoiceUI(false);
    };

    return instance;

  }catch(error){

    console.error(
      "RECOGNITION CREATE ERROR:",
      error
    );

    return null;
  }
}

function setupRecognition(){

  recognition=
    createRecognition();

  return recognition;
}

function setVoiceUI(active){

  const mic=
    document.getElementById(
      "micButton"
    );

  const status=
    document.getElementById(
      "voiceStatus"
    );

  if(mic){

    if(active){

      mic.classList.add(
        "listening"
      );

      mic.textContent="●";

    }else{

      mic.classList.remove(
        "listening"
      );

      mic.textContent="🎤";
    }
  }

  if(status){

    status.textContent=
      active
      ? "MENDENGARKAN... SILAKAN JAWAB"
      : "JAWAB DENGAN SUARA";
  }
}

  clickSound();

  if(!recognition){
    recognition=
      setupRecognition();
  }

  if(!recognition){

    showToast(
      "VOICE INPUT TIDAK DIDUKUNG BROWSER INI"
    );

    return;
  }

  try{

    recognition.lang=
      state.settings.lang;

    recognition.start();

  }catch(error){

    console.warn(
      "VOICE START:",
      error
    );

    try{
      recognition.stop();
    }catch(e){}

    setTimeout(()=>{

      try{

        recognition.lang=
          state.settings.lang;

        recognition.start();

      }catch(e){

        showToast(
          "VOICE TIDAK BISA DIMULAI"
        );

      }

    },250);
  }
}

/* =========================================================
   VOICE ANSWER NORMALIZATION
========================================================= */

const numberWords={

  "nol":"0",
  "satu":"1",
  "dua":"2",
  "tiga":"3",
  "empat":"4",
  "lima":"5",
  "enam":"6",
  "tujuh":"7",
  "delapan":"8",
  "sembilan":"9",
  "sepuluh":"10",
  "sebelas":"11",

  "dua belas":"12",
  "tiga belas":"13",
  "empat belas":"14",
  "lima belas":"15",
  "enam belas":"16",
  "tujuh belas":"17",
  "delapan belas":"18",
  "sembilan belas":"19",

  "dua puluh":"20",
  "tiga puluh":"30",
  "empat puluh":"40",
  "lima puluh":"50",
  "enam puluh":"60",
  "tujuh puluh":"70",
  "delapan puluh":"80",
  "sembilan puluh":"90",

  "seratus":"100"
};

function normalizeAnswer(value){

  let text=
    String(value || "")
      .toLowerCase()
      .trim()
      .replace(/[.,!?;:]/g," ")
      .replace(/\s+/g," ");

  Object.keys(numberWords)
    .sort(
      (a,b)=>
        b.length-a.length
    )
    .forEach(word=>{

      text=
        text.replace(
          new RegExp(
            "\\b"+
            word+
            "\\b",
            "g"
          ),
          numberWords[word]
        );

    });

  text=
    text
      .replace(
        /\b(jawabannya|jawaban|adalah|yaitu|pilih|pilihan|nomor)\b/g,
        ""
      )
      .replace(/\s+/g," ")
      .trim();

  const letters={
    "a":"0",
    "b":"1",
    "c":"2",
    "d":"3"
  };

  if(
    Object.prototype.hasOwnProperty.call(
      letters,
      text
    )
  ){

    return letters[text];
  }

  return text;
}

function voiceMatches(
  spoken,
  option,
  index
){

  const normalizedSpoken=
    normalizeAnswer(spoken);

  const normalizedOption=
    normalizeAnswer(option);

  if(
    normalizedSpoken===
    normalizedOption
  ){
    return true;
  }

  if(
    normalizedSpoken===
    String(index+1)
  ){
    return true;
  }

  const letter=
    ["a","b","c","d"][index];

  if(
    normalizedSpoken===letter
  ){
    return true;
  }

  if(
    normalizedSpoken.length>=3 &&
    (
      normalizedSpoken.includes(
        normalizedOption
      ) ||
      normalizedOption.includes(
        normalizedSpoken
      )
    )
  ){
    return true;
  }

  return false;
}

/* =========================================================
   QUIZ
========================================================= */

function startQuiz(){

  state.quizIndex=0;
  state.quizScore=0;

  renderQuiz();
}

function renderQuiz(){

  const subject=
    subjects[state.subject];

  if(!subject){
    renderSubjects();
    return;
  }

  const lesson=
    subject.lessons[
      state.lessonIndex
    ];

  if(!lesson){
    renderChapters();
    return;
  }

  const total=
    lesson.questions.length;

  if(
    state.quizIndex>=total
  ){

    finishQuiz();
    return;
  }

  const question=
    lesson.questions[
      state.quizIndex
    ];

  screen.innerHTML=`

    <div class="panel">

      <div class="title">

        QUIZ
        ${state.quizIndex+1}
        /
        ${total}

      </div>

      <div class="question">

        ${question.text}

      </div>

      <button
        type="button"
        class="pixel-btn center"
        data-action="readQuestion">

        🔊 READ QUESTION

      </button>

      <div id="quizOptions">

        ${question.options
          .map((option,index)=>`

            <button
              type="button"
              class="option"
              data-option="${index}">

              ${String.fromCharCode(65+index)}.
              ${option}

            </button>

          `)
          .join("")}

      </div>

      <div class="voice-box">

        <div
          id="voiceStatus"
          class="voice-status">

          JAWAB DENGAN SUARA

        </div>

        <div
          id="micButton"
          class="mic"
          role="button"
          tabindex="0"
          data-action="voiceAnswer">

          🎤

        </div>

          id="transcript"
          class="transcript">

          Tekan microphone
          lalu jawab.

        </div>

      </div>

      <button
        type="button"
        class="pixel-btn"
        data-action="lesson">

        ◀ BACK

      </button>

    </div>
  `;

  document
    .querySelectorAll("[data-option]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const index=
            Number(
              button.dataset.option
            );

          answerQuiz(index);

        }
      );

    });

  bindActions();

  setupRecognition();
}

function readQuestion(){

  const subject=
    subjects[state.subject];

  const lesson=
    subject.lessons[
      state.lessonIndex
    ];

  const question=
    lesson.questions[
      state.quizIndex
    ];

  let text=
    "Pertanyaan. "+
    question.text+
    ". ";

  question.options
    .forEach((option,index)=>{

      text+=
        "Pilihan "+
        String.fromCharCode(65+index)+
        ". "+
        option+
        ". ";

    });

  speak(text);
}

function answerQuiz(index){

  const subject=
    subjects[state.subject];

  const lesson=
    subject.lessons[
      state.lessonIndex
    ];

  const question=
    lesson.questions[
      state.quizIndex
    ];

  const buttons=
    document.querySelectorAll(
      "[data-option]"
    );

  buttons.forEach(button=>{
    button.disabled=true;
  });

  const correctIndex=
    question.answer;

  const correct=
    index===correctIndex;

  buttons.forEach(
    (button,buttonIndex)=>{

      if(
        buttonIndex===
        correctIndex
      ){

        button.classList.add(
          "correct"
        );
      }

      if(
        buttonIndex===index &&
        !correct
      ){

        button.classList.add(
          "wrong"
        );
      }

    }
  );

  if(correct){

    state.quizScore++;

    correctSound();

    addReward(20,5);

    showToast(
      "CORRECT! +20 EXP"
    );

    speak(
      "Benar! Jawaban kamu tepat."
    );

  }else{

    wrongSound();

    speak(
      "Belum tepat. "+
      "Jawaban yang benar adalah "+
      question.options[
        correctIndex
      ]
    );
  }

  setTimeout(()=>{

    state.quizIndex++;

    renderQuiz();

  },1400);
}

/* =========================================================
   VOICE QUIZ
========================================================= */

function processVoiceAnswer(
  spokenText
){

  const subject=
    subjects[state.subject];

  if(!subject){
    return;
  }

  const lesson=
    subject.lessons[
      state.lessonIndex
    ];

  const question=
    lesson.questions[
      state.quizIndex
    ];

  let selectedIndex=-1;

  question.options.forEach(
    (option,index)=>{

      if(
        voiceMatches(
          spokenText,
          option,
          index
        )
      ){

        selectedIndex=index;
      }

    }
  );

  if(selectedIndex===-1){

    const status=
      document.getElementById(
        "voiceStatus"
      );

    if(status){

      status.textContent=
        "JAWABAN BELUM TERBACA. COBA LAGI.";
    }

    speak(
      "Saya belum menangkap jawabanmu. "+
      "Coba jawab lagi."
    );

    return;
  }

  answerQuiz(
    selectedIndex
  );
}

/* =========================================================
   FINISH QUIZ
========================================================= */

function finishQuiz(){

  const subject=
    subjects[state.subject];

  const lesson=
    subject.lessons[
      state.lessonIndex
    ];

  const total=
    lesson.questions.length;

  const score=
    state.quizScore;

  const percentage=
    Math.round(
      score/total*100
    );

  const key=
    state.subject+
    "_" +
    state.lessonIndex;

  state.progress[key]={
    score:score,
    total:total,
    percentage:percentage,
    date:new Date().toISOString()
  };

  state.streak++;

  saveGame(false);

  let message=
    "TERUS BERLATIH!";

  if(percentage===100){
    message=
      "PERFECT! ★★★";
  }else if(percentage>=50){
    message=
      "GOOD JOB! ★★";
  }

  screen.innerHTML=`

    <div class="panel">

        QUIZ COMPLETE

      <div class="question"
           style="text-align:center">

        ${message}

        <br><br>

        <br>

        ${percentage}%

      </div>

      <div class="feedback">

        SUBJECT:<br>
        ${subject.title}

        <br><br>

        CHAPTER:<br>
        ${lesson.title}

        <br><br>

        PROGRESS SUDAH DISIMPAN.

      </div>

      <button
        type="button"
        class="pixel-btn"
        data-action="lesson">

        ↻ ULANG / KEMBALI

      </button>

      <button
        type="button"
        class="pixel-btn"
        data-action="chapters">

        CHAPTER SELECT

      </button>

      <button
        type="button"
        class="pixel-btn"
        data-action="subjects">

      </button>

      <button
        type="button"
        class="pixel-btn"
        data-action="home">

        MAIN MENU

  bindActions();

  speak(

  );
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   ACTION ROUTER
========================================================= */

function handleAction(action){

  if(!action){
    return;
  }

  clickSound();

  switch(action){

    case "home":
      renderHome();
      break;

    case "subjects":
      renderSubjects();
      break;

    case "chapters":
      renderChapters();
      break;

    case "lesson":
      renderLesson();
      break;

    case "practice":
      renderPractice();
      break;

    case "checkPractice":
      checkPractice();
      break;

    case "quiz":
      startQuiz();
      break;

    case "readQuestion":
      readQuestion();
      break;

    case "readLesson":
      readCurrentLesson();
      break;

    case "voiceAnswer":
      startVoice();
      break;

    case "progress":
      renderProgress();
      break;

    case "voice":
      renderVoiceCenter();
      break;

    case "testVoice":
      testVoice();
      break;

    case "testMic":
      testMicrophone();
      break;

    case "settings":
      renderSettings();
      break;

    case "saveSettings":
      saveSettings();
      break;

    case "music":
      toggleMusic();
      break;

    case "save":
      saveGame();
      break;

    case "a":
      renderSubjects();
      break;

    case "b":
      renderHome();
      break;

    case "start":
      renderSubjects();
      break;

    case "select":
      renderProgress();
      break;

    default:
      console.warn(
        "Unknown action:",
        action
      );
  }
}

/* =========================================================
   UNIVERSAL CLICK ENGINE
========================================================= */

function bindActions(){

  const elements=
    document.querySelectorAll(
      "[data-action]"
    );

  elements.forEach(element=>{

    if(
      element.dataset.clickBound==="1"
    ){
      return;
    }

    element.dataset.clickBound="1";

    element.addEventListener(
      "click",
      function(event){

        event.preventDefault();
        event.stopPropagation();

        handleAction(
          this.getAttribute(
            "data-action"
          )
        );

      }
    );

  });
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    const key=
      event.key.toLowerCase();

    if(key==="escape"){

      event.preventDefault();

      renderHome();

      return;
    }

    if(
      key==="b" &&
      !["input","textarea","select"]
        .includes(
          document.activeElement.tagName
            .toLowerCase()
        )
    ){

      event.preventDefault();

      renderHome();

      return;
    }

    if(key==="enter"){

      const focused=
        document.activeElement;

      if(
        focused &&
        focused.dataset &&
        focused.dataset.action
      ){

        event.preventDefault();

        handleAction(
          focused.dataset.action
        );
      }
    }

  }
);
