<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="REZA Pixel School Academy - Interactive SMP Learning">

<title>REZA V10 — PIXEL SCHOOL ACADEMY</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root{
  --bg:#030303;
  --panel:#080b0d;
  --panel2:#0d1114;
  --line:#263238;
  --pixel:#39ff88;
  --pixel2:#00e5ff;
  --white:#e8fff2;
  --muted:#8da49a;
  --danger:#ff4d6d;
  --gold:#ffd166;
  --purple:#b388ff;
  --shadow:0 0 18px rgba(57,255,136,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:var(--white);
  font-family:'Press Start 2P',monospace;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#app{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 10%,rgba(0,229,255,.06),transparent 35%),
    linear-gradient(#030303,#050505);
}

.crt::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.025) 0,
    rgba(255,255,255,.025) 1px,
    transparent 1px,
    transparent 4px
  );
  mix-blend-mode:screen;
}

#boot{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.boot-box{
  width:min(700px,94vw);
  border:4px solid var(--pixel);
  padding:34px 24px;
  text-align:center;
  box-shadow:
    8px 8px 0 #06140b,
    0 0 35px rgba(57,255,136,.2);
  background:#020403;
}

.boot-logo{
  font-size:clamp(25px,7vw,55px);
  color:var(--pixel);
  text-shadow:4px 4px 0 #092b18;
  margin-bottom:25px;
}

.boot-sub{
  color:var(--pixel2);
  font-size:11px;
  line-height:1.9;
}

.boot-bar{
  height:18px;
  border:3px solid var(--pixel);
  margin:30px 0 15px;
  padding:3px;
}

.boot-fill{
  height:100%;
  width:0;
  background:var(--pixel);
  transition:width .15s linear;
}

.boot-status{
  color:var(--muted);
  font-size:9px;
  min-height:25px;
}

.shell{
  width:min(1200px,96vw);
  margin:auto;
  padding:14px 0 50px;
}

.topbar{
  border:3px solid var(--line);
  background:#060808;
  box-shadow:8px 8px 0 #010101;
  padding:12px;
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.brand{
  color:var(--pixel);
  font-size:14px;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.stat{
  border:2px solid var(--line);
  background:#020303;
  padding:8px;
  font-size:8px;
  color:var(--muted);
}

.stat b{
  color:var(--white);
}

.screen{
  margin-top:14px;
  border:4px solid var(--line);
  background:
    linear-gradient(rgba(57,255,136,.015),rgba(57,255,136,.015)),
    #050708;
  box-shadow:
    8px 8px 0 #010101,
    inset 0 0 35px rgba(0,0,0,.7);
  min-height:650px;
  padding:18px;
}

.screen-title{
  color:var(--pixel);
  font-size:16px;
  line-height:1.7;
  margin:4px 0 18px;
}

.screen-subtitle{
  color:var(--muted);
  font-size:9px;
  line-height:1.8;
  margin-bottom:18px;
}

.pixel-line{
  height:3px;
  background:var(--line);
  margin:16px 0;
  position:relative;
}

.pixel-line::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:25%;
  height:100%;
  background:var(--pixel);
}

.menu{
  display:grid;
  gap:9px;
  max-width:850px;
}

.menu-btn{
  text-align:left;
  color:var(--white);
  background:#080b0d;
  border:3px solid #20292d;
  padding:14px;
  font-size:10px;
  line-height:1.6;
  box-shadow:5px 5px 0 #010101;
  transition:.12s;
}

.menu-btn:hover,
.menu-btn:focus{
  border-color:var(--pixel);
  color:var(--pixel);
  transform:translate(2px,2px);
  box-shadow:3px 3px 0 #010101;
  outline:none;
}

.menu-btn .cursor{
  color:var(--pixel);
  margin-right:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  border:3px solid var(--line);
  background:#080b0d;
  padding:15px;
  box-shadow:5px 5px 0 #010101;
}

.card:hover{
  border-color:#40545b;
}

.card h3{
  color:var(--pixel);
  font-size:11px;
  line-height:1.6;
  margin:0 0 10px;
}

.card p{
  color:var(--muted);
  font-size:8px;
  line-height:2;
}

.card .meta{
  color:var(--pixel2);
  font-size:7px;
  line-height:1.8;
}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:16px;
}

.btn{
  border:3px solid var(--pixel);
  background:#07100a;
  color:var(--pixel);
  padding:12px 14px;
  font-size:9px;
  box-shadow:4px 4px 0 #010101;
}

.btn:hover{
  background:var(--pixel);
  color:#000;
}

.btn.secondary{
  border-color:var(--pixel2);
  color:var(--pixel2);
  background:#061014;
}

.btn.secondary:hover{
  background:var(--pixel2);
  color:#000;
}

.btn.danger{
  border-color:var(--danger);
  color:var(--danger);
  background:#100306;
}

.btn.gold{
  border-color:var(--gold);
  color:var(--gold);
  background:#100d03;
}

.lesson{
  max-width:1000px;
}

.lesson-header{
  border:3px solid var(--pixel);
  padding:15px;
  background:#050a07;
  margin-bottom:14px;
}

.lesson-header h2{
  color:var(--pixel);
  font-size:15px;
  line-height:1.7;
  margin:0 0 10px;
}

.lesson-header p{
  color:var(--muted);
  font-size:8px;
  line-height:2;
}

.lesson-section{
  border:3px solid var(--line);
  background:#080b0d;
  padding:18px;
  margin:12px 0;
  box-shadow:4px 4px 0 #010101;
}

.lesson-section h3{
  color:var(--pixel2);
  font-size:11px;
  line-height:1.7;
  margin:0 0 14px;
}

.lesson-section p,
.lesson-section li{
  color:#b8cbc2;
  font-size:9px;
  line-height:2.2;
}

.lesson-section ul{
  padding-left:20px;
}

.example{
  border-left:5px solid var(--gold);
  background:#0c0b07;
  padding:14px;
  color:#ffe7a3;
  font-size:9px;
  line-height:2.1;
  margin-top:12px;
}

.tip{
  border-left:5px solid var(--pixel);
  background:#06100a;
  padding:14px;
  color:#bfffd5;
  font-size:9px;
  line-height:2.1;
  margin-top:12px;
}

.practice-box{
  border:3px solid var(--purple);
  background:#0b0710;
  padding:18px;
  margin-top:14px;
}

.practice-box h3{
  color:var(--purple);
  font-size:11px;
}

input[type="text"]{
  width:100%;
  background:#020303;
  border:3px solid var(--line);
  color:var(--white);
  padding:14px;
  font-size:10px;
  outline:none;
}

input[type="text"]:focus{
  border-color:var(--pixel);
}

.question{
  border:4px solid var(--pixel);
  background:#050906;
  padding:20px;
  margin-bottom:16px;
}

.question-number{
  color:var(--pixel2);
  font-size:8px;
  margin-bottom:15px;
}

.question-text{
  color:#fff;
  font-size:12px;
  line-height:2;
}

.options{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.option{
  border:3px solid var(--line);
  background:#080b0d;
  color:#dfffea;
  padding:14px;
  text-align:left;
  font-size:9px;
  line-height:1.8;
}

.option:hover{
  border-color:var(--pixel);
  color:var(--pixel);
}

.option:disabled{
  opacity:.55;
}

.voice-box{
  border:3px solid var(--pixel2);
  background:#031014;
  padding:18px;
  margin-top:15px;
}

.voice-status{
  color:var(--pixel2);
  font-size:9px;
  line-height:2;
  min-height:36px;
}

.voice-transcript{
  border:2px solid #173740;
  padding:12px;
  margin-top:10px;
  color:#b8edf5;
  font-size:8px;
  line-height:2;
  min-height:40px;
}

.mic-btn{
  margin-top:12px;
  border:3px solid var(--pixel2);
  background:#001014;
  color:var(--pixel2);
  padding:14px;
  font-size:10px;
}

.mic-btn:hover{
  background:var(--pixel2);
  color:#000;
}

.progress-wrap{
  margin-top:12px;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:7px;
  margin-bottom:7px;
}

.progress{
  height:13px;
  border:2px solid var(--line);
  background:#010101;
  padding:2px;
}

.progress-fill{
  height:100%;
  background:var(--pixel);
  width:0;
}

.subject-card{
  min-height:170px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.subject-icon{
  font-size:28px;
  margin-bottom:8px;
  filter:grayscale(.3);
}

.chapter-card{
  min-height:170px;
}

.chapter-card.completed{
  border-color:#28663e;
}

.chapter-card.locked{
  opacity:.5;
}

.badge{
  display:inline-block;
  border:2px solid var(--line);
  padding:5px 7px;
  font-size:7px;
  color:var(--muted);
  margin-top:8px;
}

.badge.done{
  border-color:var(--pixel);
  color:var(--pixel);
}

.hud{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.hud-item{
  border:2px solid var(--line);
  background:#030505;
  padding:8px;
  color:var(--muted);
  font-size:7px;
}

.hud-item b{
  color:var(--pixel);
}

.controls{
  margin-top:28px;
  border-top:3px solid var(--line);
  padding-top:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}

.dpad{
  display:grid;
  grid-template-columns:40px 40px 40px;
  grid-template-rows:40px 40px 40px;
}

.dpad button,
.action-buttons button{
  border:3px solid #344047;
  background:#0a0d0f;
  color:var(--pixel);
  font-size:12px;
}

.dpad button:hover,
.action-buttons button:hover{
  border-color:var(--pixel);
  background:#101813;
}

.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .center{grid-column:2;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
.dpad .down{grid-column:2;grid-row:3}

.action-buttons{
  display:flex;
  gap:8px;
  align-items:center;
}

.action-buttons button{
  width:50px;
  height:38px;
  border-radius:4px;
}

.start-select{
  display:flex;
  gap:8px;
}

.start-select button{
  border:2px solid #424b4e;
  background:#0a0d0f;
  color:#bbb;
  padding:7px 10px;
  font-size:7px;
  transform:skew(-12deg);
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  z-index:10001;
  background:#050908;
  border:3px solid var(--pixel);
  color:var(--pixel);
  padding:13px 16px;
  font-size:8px;
  line-height:1.7;
  box-shadow:5px 5px 0 #000;
  transition:.2s;
  max-width:90vw;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.footer{
  text-align:center;
  color:#4f6159;
  font-size:7px;
  line-height:2;
  margin-top:18px;
}

.empty{
  border:3px dashed var(--line);
  padding:25px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
  line-height:2;
}

.small{
  color:var(--muted);
  font-size:7px;
  line-height:1.9;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .shell{
    width:94vw;
  }

  .screen{
    padding:12px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .topbar{
    align-items:flex-start;
  }

  .stats{
    width:100%;
  }

  .stat{
    flex:1;
    min-width:70px;
  }

  .menu-btn{
    font-size:9px;
  }

  .question-text{
    font-size:10px;
  }

  .lesson-section p,
  .lesson-section li{
    font-size:8px;
  }
}
</style>
</head>

<div id="app" style="display:none;"></div>

/* =========================================================
   STATE
========================================================= */

const STORAGE_KEY = "reza_pixel_school_v10_black";

const DEFAULT_STATE = {
  level:1,
  exp:0,
  coins:0,
  streak:0,
  totalCorrect:0,
  totalAnswered:0,
  completedLessons:[],
  completedChapters:[],
  subjectXP:{},
  settings:{
    lang:"id-ID",
    rate:0.9,
    music:true,
    voice:true
  }
};

let state = loadState();

let currentView = "home";
let currentSubject = null;
let currentChapter = null;
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizLocked = false;

let recognition = null;
let recognitionRunning = false;
let speechVoices = [];

let audioCtx = null;
let musicTimer = null;
let musicStep = 0;

/* =========================================================
   SAFE STATE
========================================================= */

function cloneDefault(){
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function loadState(){

  const base = cloneDefault();

  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return base;
    }

    const saved = JSON.parse(raw);

    if(saved && typeof saved === "object"){
      Object.assign(base,saved);

      if(!Array.isArray(base.completedLessons)){
        base.completedLessons = [];
      }

      if(!Array.isArray(base.completedChapters)){
        base.completedChapters = [];
      }

      if(!base.subjectXP || typeof base.subjectXP !== "object"){
        base.subjectXP = {};
      }

      base.settings = Object.assign(
        cloneDefault().settings,
        saved.settings || {}
      );
    }

  }catch(error){
    console.warn("REZA SAVE LOAD:",error);
  }

  return base;
}

function saveState(){

  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );
  }catch(error){
    console.warn("REZA SAVE ERROR:",error);
  }

  updateStats();
}

/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalize(text){

  return String(text ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ")
    .trim();
}

function showToast(message){

  const toast = $("toast");

  if(!toast){
    return;
  }

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(function(){
    toast.classList.remove("show");
  },2200);
}

function requiredExp(){

  return 100 + ((state.level - 1) * 50);
}

function addReward(exp,coins){

  state.exp += Number(exp) || 0;
  state.coins += Number(coins) || 0;

  let leveled = false;

  while(state.exp >= requiredExp()){

    state.exp -= requiredExp();
    state.level++;

  if(leveled){

}

/* =========================================================
   AUDIO
========================================================= */

function ensureAudio(){

  if(!audioCtx){

    try{
      audioCtx =
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }catch(error){
      return;
    }
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume().catch(function(){});
  }
}

function beep(freq,duration,type,volume){

  if(!state.settings.music){
    return;
  }

  ensureAudio();

  if(!audioCtx){
    return;
  }

  try{

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type || "square";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
      volume || 0.025,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);

  }catch(error){}
}

function clickSound(){
  beep(420,.055,"square",.035);
}

function correctSound(){
  beep(660,.08,"square",.04);

  setTimeout(function(){
    beep(880,.1,"square",.04);
  },90);
}

function wrongSound(){
  beep(150,.16,"sawtooth",.035);
}

function startMusic(){

  if(musicTimer || !state.settings.music){
    return;
  }

  ensureAudio();

  const notes = [
    196,196,261.63,293.66,
    329.63,293.66,261.63,196,
    220,220,293.66,329.63,
    392,329.63,293.66,220
  ];

  musicTimer = setInterval(function(){

    if(!state.settings.music){
      return;
    }

    beep(
      notes[musicStep % notes.length],
      .11,
      "square",
      .012
    );

    musicStep++;

  },260);
}

function stopMusic(){

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

function toggleMusic(){

  state.settings.music =
    !state.settings.music;

  if(state.settings.music){
    startMusic();
    showToast("PIXEL MUSIC: ON");
  }else{
    stopMusic();
    showToast("PIXEL MUSIC: OFF");
  }

  saveState();
  render();
}

========================================================= */

function loadVoices(){

  if(!("speechSynthesis" in window)){
    return;
  }

  speechVoices =
    window.speechSynthesis.getVoices() || [];
}

if("speechSynthesis" in window){
  loadVoices();

  window.speechSynthesis.onvoiceschanged =
    loadVoices;
}

function speak(text){

  if(!state.settings.voice){
    return;
  }

  if(!("speechSynthesis" in window)){
    showToast("VOICE TTS tidak tersedia di browser ini.");
    return;
  }

  try{

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang =
      state.settings.lang || "id-ID";

    utterance.rate =
      Number(state.settings.rate) || .9;

    utterance.pitch = 1;

    const lang =
      utterance.lang.toLowerCase();

    const exact =
      speechVoices.find(function(v){
        return v.lang &&
          v.lang.toLowerCase() === lang;
      });

    const partial =
      speechVoices.find(function(v){
        return v.lang &&
          v.lang.toLowerCase()
           .startsWith(lang.split("-")[0]);
      });

    if(exact){
      utterance.voice = exact;
    }else if(partial){
      utterance.voice = partial;
    }

    window.speechSynthesis.speak(utterance);

  }catch(error){

    console.warn("TTS:",error);
  }
}

/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function recognitionClass(){

  return window.SpeechRecognition ||
         window.webkitSpeechRecognition ||
         null;
}

function setupRecognition(){

  const Recognition = recognitionClass();

  if(!Recognition){
    return null;
  }

  try{

    const rec = new Recognition();

    rec.lang =
      state.settings.lang || "id-ID";

    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 3;

    return rec;

  }catch(error){

    console.warn("Recognition:",error);
    return null;
  }
}

function stopRecognition(){

  if(recognition){

    try{
      recognition.stop();
    }catch(error){}
  }

  recognitionRunning = false;
}

function startVoice(){

  if(quizLocked){
    return;
  }

  if(!recognitionClass()){

    showToast(
      "Voice Recognition belum didukung browser ini."
    );

    return;
  }

  stopRecognition();

  recognition = setupRecognition();

  if(!recognition){
    showToast("Voice Recognition gagal dibuat.");
    return;
  }

  const status = $("voiceStatus");
  const transcript = $("voiceTranscript");

  recognition.onstart = function(){

    recognitionRunning = true;

    if(status){
      status.textContent =
        "🎤 MENDENGARKAN... Silakan jawab.";
    }

    if(transcript){
      transcript.textContent =
        ">> Listening...";
    }

    beep(700,.07,"square",.03);
  };

  recognition.onresult = function(event){

    let textResult = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      if(event.results[i] &&
         event.results[i][0]){

        textResult +=
          event.results[i][0].transcript + " ";
      }
    }

    textResult = textResult.trim();

    if(transcript){
      transcript.textContent =
        ">> " + textResult;
    }

    processVoiceAnswer(textResult);
  };

  recognition.onerror = function(event){

    recognitionRunning = false;

    if(status){

      if(event.error === "not-allowed"){
        status.textContent =
          "MIC DITOLAK. Izinkan microphone di browser.";
      }else if(event.error === "no-speech"){
        status.textContent =
          "Tidak terdengar jawaban. Tekan MIC lagi.";
      }else{
        status.textContent =
          "VOICE ERROR: " + event.error;
      }
    }
  };

  recognition.onend = function(){

    recognitionRunning = false;
  };

  try{

    recognition.start();

  }catch(error){

    recognitionRunning = false;

    showToast(
      "MIC belum siap. Tekan tombol MIC lagi."
    );
  }
}

function voiceMatches(userAnswer,answers){

  const user = normalize(userAnswer);

  if(!user){
    return false;
  }

  return answers.some(function(answer){

    const target = normalize(answer);

    if(!target){
      return false;
    }

    if(user === target){
      return true;
    }

    if(user.includes(target)){
      return true;
    }

    return target.includes(user) &&
      user.length >= 3;
  });
}

function processVoiceAnswer(answer){

  if(quizLocked || !quizQuestions[quizIndex]){
    return;
  }

  quizLocked = true;
  stopRecognition();

  const q = quizQuestions[quizIndex];
  const ok = voiceMatches(answer,q.a);

  state.totalAnswered++;

  if(ok){

    quizScore++;
    state.totalCorrect++;
    state.streak++;

    addReward(20,8);
    correctSound();

    setVoiceStatus(
      "✅ BENAR! +20 EXP. Jawaban: " + answer
    );

  }else{

    state.streak = 0;
    wrongSound();

    setVoiceStatus(
      "❌ BELUM TEPAT. Kamu menjawab: " +
      answer +
      " | Jawaban: " +
      q.a[0]
    );
  }

  saveState();

  setTimeout(function(){

    quizIndex++;
    quizLocked = false;

    if(quizIndex >= quizQuestions.length){

      finishQuiz();

    }else{

      renderVoiceQuizQuestion();
    }

  },1600);
}

function setVoiceStatus(text){

  const el = $("voiceStatus");

  if(el){
    el.textContent = text;
  }
}

function makeQuiz(subjectId){

  const subject =
    SUBJECTS[subjectId];

  if(!subject){
    return [];
  }

  const copy =
    subject.questions.slice();

  for(let i = copy.length - 1; i > 0; i--){

    const j =
      Math.floor(Math.random() * (i + 1));

    const temp = copy[i];

    copy[i] = copy[j];
    copy[j] = temp;
  }

  return copy.slice(
    0,
    Math.min(5,copy.length)
  );
}

function answerQuiz(index){

  if(quizLocked){
    return;
  }

  const q =
    quizQuestions[quizIndex];

  if(!q){
    return;
  }

  quizLocked = true;

  const options =
    document.querySelectorAll(".option");

  options.forEach(function(button){
    button.disabled = true;
  });

  state.totalAnswered++;

  const selected =
    q.a[index] || "";

  const correct =
    index === q.c ||
    voiceMatches(selected,[q.a[0]]);

  if(correct){

    quizScore++;
    state.totalCorrect++;
    state.streak++;

    addReward(20,8);
    correctSound();

    showToast(
      "BENAR! +20 EXP +8 COINS"
    );

  }else{

    state.streak = 0;
    wrongSound();

    showToast(
      "BELUM TEPAT. Jawaban: " +
      q.a[0]
    );
  }

  saveState();

  setTimeout(function(){

    quizIndex++;
    quizLocked = false;

    if(quizIndex >= quizQuestions.length){

      finishQuiz();

    }else{

      render();
    }

  },1200);
}

function finishQuiz(){

  stopRecognition();

  const total =
    quizQuestions.length;

  const percent =
    total
    ? Math.round((quizScore / total) * 100)
    : 0;

  const bonus =
    quizScore * 10;

  state.coins += bonus;

  if(quizScore === total && total > 0){

    state.streak++;
    state.exp += 30;

  }

  saveState();

  currentView = "home";

  render();

  showToast(
    "QUIZ SELESAI: " +
    quizScore + "/" +
    total +
    " (" + percent + "%)"
  );
}

function setupSettings(){

    $("voiceLang");

  const rate =
    $("voiceRate");

    $("voiceRateValue");

  if(lang){

    lang.addEventListener(
      "change",
      function(){

        state.settings.lang =
          lang.value;

      }
    );
  }

  if(rate){

    rate.addEventListener(
      "input",
      function(){

        state.settings.rate =
          Number(rate.value);

        if(rateValue){
          rateValue.textContent =
            rate.value;
        }
      }
    );
  }
}

function saveSettings(){

  const lang =
    $("voiceLang");

  const rate =
    $("voiceRate");

  if(lang){
    state.settings.lang =
      lang.value;
  }

  if(rate){
    state.settings.rate =
      Number(rate.value);
  }

  saveState();

  showToast("SETTINGS SAVED");

  setTimeout(function(){

/* =========================================================
   ACTION ROUTER
========================================================= */

function handleAction(action,id,index){

  clickSound();

  switch(action){

    case "home":

      stopRecognition();
      currentView = "home";
      render();
      break;

    case "back":

      if(currentView === "home"){
        return;
      }

      if(currentView === "lesson" ||
         currentView === "quiz"){

        currentView = "chapters";

      }else if(currentView === "chapters"){

        currentView = "subjects";

      }else{

        currentView = "home";
      }

      stopRecognition();
      render();
      break;

    case "subjects":

      currentView = "subjects";
      render();
      break;

    case "subject":

      if(SUBJECTS[id]){

        currentSubject = id;
        currentView = "chapters";
        render();
      }

      break;

    case "chapters":

      currentView = "chapters";
      render();
      break;

    case "chapter":

      if(
        SUBJECTS[currentSubject] &&
        SUBJECTS[currentSubject]
          .chapters
          .some(function(ch){
            return ch.id === id;
          })
      ){

        currentChapter = id;
        currentView = "lesson";
        render();
      }

      break;

    case "completeLesson":

      completeCurrentLesson();
      break;

    case "chapterQuiz":

      startChapterQuiz(
        currentSubject,
        id || currentChapter
      );
      break;

    case "quiz":

      if(!currentSubject){
        currentSubject = "matematika";
      }

      startSubjectQuiz(
        currentSubject
      );
      break;

    case "quizAnswer":

      answerQuiz(
        Number(index)
      );
      break;

    case "voice":

      currentView = "voice";
      render();
      break;

    case "voiceSubject":

      startVoiceQuiz(id);
      break;

    case "voiceStart":

      startVoice();
      break;

    case "voiceBack":

      stopRecognition();
      currentView = "voice";
      render();
      break;

    case "speakQuestion":

      if(quizQuestions[quizIndex]){
        speak(
          quizQuestions[quizIndex].q
        );
      }

      break;

    case "progress":

      currentView = "progress";
      render();
      break;

    case "settings":

      currentView = "settings";
      render();
      setTimeout(
        setupSettings,
        0
      );
      break;

    case "saveSettings":

      saveSettings();
      break;

    case "toggleVoice":

      toggleVoice();
      break;

    case "music":

      toggleMusic();
      break;

    case "save":

      saveState();
      showToast("GAME SAVED!");
      break;

    case "reset":

      resetGame();
      break;

    case "select":

      showToast("A = SELECT");
      break;

    case "noop":

      beep(250,.04,"square",.02);
      break;

    default:

      console.warn(
        "Unknown action:",
        action
      );
  }
}

/* =========================================================
   EVENT BINDING
========================================================= */

function bindActions(){

  document
    .querySelectorAll("[data-action]")
    .forEach(function(element){

      element.addEventListener(
        "click",
        function(){

          const action =
            element.getAttribute(
              "data-action"
            );

          const id =
            element.getAttribute(
              "data-id"
            );

          const index =
            element.getAttribute(
              "data-index"
            );

          handleAction(
            action,
            id,
            index
          );

        }
      );

    });
}

/* =========================================================
   RESET
========================================================= */

function resetGame(){

  const ok =
    window.confirm(
      "RESET SEMUA PROGRESS REZA?"
    );

  if(!ok){
    return;
  }

  state =
    cloneDefault();

  saveState();

  currentView = "home";
  currentSubject = null;
  currentChapter = null;

  showToast(
    "PROGRESS DIRESET."
  );

  render();
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      handleAction("back");
    }

    if(event.key === "Enter"){

      const active =
        document.activeElement;

      if(
        active &&
        active.tagName === "BUTTON"
      ){

        active.click();
      }
    }

  }
);

/* =========================================================
   AUDIO UNLOCK
========================================================= */

document.addEventListener(
  "pointerdown",
  function(){

    ensureAudio();

    if(
      state.settings.music &&
      !musicTimer
    ){
      startMusic();
    }

  },
  {once:true}
);

/* =========================================================
   INITIALIZE
========================================================= */

function initialize(){

  updateStats();
  render();

  if(state.settings.music){
    startMusic();
  }
}

/* =========================================================
   BOOT
========================================================= */

function boot(){

  const fill =
    $("bootFill");

  const status =
    $("bootStatus");

  const bootSteps = [
    "LOADING PIXEL ENGINE...",
    "LOADING SCHOOL DATABASE...",
    "LOADING SMP MATERIAL...",
    "LOADING VOICE ENGINE...",
    "LOADING MUSIC ENGINE...",
    "CHECKING SAVE DATA...",
    "SYSTEM READY."
  ];

  let progress = 0;
  let step = 0;

  const timer =
    setInterval(function(){

      progress += 4;

      if(fill){
        fill.style.width =
          Math.min(100,progress) + "%";
      }

      if(
        progress % 14 === 0 &&
        step < bootSteps.length
      ){

        if(status){
          status.textContent =
            bootSteps[step];
        }

        step++;
      }

      if(progress >= 100){

        clearInterval(timer);

        setTimeout(function(){

          const bootScreen =
            $("boot");

          const app =
            $("app");

          if(bootScreen){
            bootScreen.style.display =
              "none";
          }

          if(app){
            app.style.display =
              "block";
          }

          initialize();

        },300);
      }

    },45);
}

/* Start */
boot();

})();
